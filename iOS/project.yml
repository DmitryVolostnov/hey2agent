name: VoiceLoopRemote
options:
  bundleIdPrefix: me.volostnov
packages:
  VoiceLoopLink:
    path: ../Link
targets:
  VoiceLoopRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    dependencies:
      - package: VoiceLoopLink
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: voice-loop
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: "Чтобы показывать плашку voice-loop с вашего Mac в домашней сети. Данные шифруются и не уходят в интернет."
        NSBonjourServices: [_voiceloop._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.volostnov.voiceloop.remote
        DEVELOPMENT_TEAM: CYHGQ2574W
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
