name: VoiceLoopRemote
options:
  bundleIdPrefix: me.volostnov
  developmentLanguage: en
packages:
  VoiceLoopLink:
    path: ../Link
targets:
  VoiceLoopRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources, Assets.xcassets, Resources]
    dependencies:
      - package: VoiceLoopLink
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: hey2agent
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: "To show the hey2agent panel from your Mac over your home network. Data is encrypted and never goes to the internet."
        NSBonjourServices: [_voiceloop._tcp]
        NSMicrophoneUsageDescription: "To dictate a reply to the agent. Audio goes only to your Mac over an encrypted connection and is transcribed there."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.volostnov.voiceloop.remote
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
